<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Expense</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <div id="app">
    <header>
      <button id="btn-export">Xprt</button>
      <p class="label">Total Balance</p>
      <h1 id="total-display">€ 0.00</h1>
    </header>

    <div class="input-card">
  <input type="number" id="amount-input" placeholder="0" step="1">

  <select id="category-input">
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Utilities">Utilities</option>
    <option value="Health">Health</option>
    <option value="Education">Education</option>
    <option value="Other">Other</option>
    <option value="GPL">GPL</option>
    <option value="Groceries">Groceries</option>
    <option value="Restaurants">Restaurants</option>
    <option value="Coffee">Coffee</option>
    <option value="Takeaway">Takeaway</option>
    <option value="Fuel">Fuel</option>
    <option value="Parking">Parking</option>
    <option value="Tolls">Tolls</option>
    <option value="Public Transport">Public Transport</option>
    <option value="Car Maintenance">Car Maintenance</option>
    <option value="Car Insurance">Car Insurance</option>
    <option value="Rent">Rent</option>
    <option value="Mortgage">Mortgage</option>
    <option value="Home Maintenance">Home Maintenance</option>
    <option value="Furniture">Furniture</option>
    <option value="Electricity">Electricity</option>
    <option value="Gas">Gas</option>
    <option value="Water">Water</option>
    <option value="Internet">Internet</option>
    <option value="Mobile Phone">Mobile Phone</option>
    <option value="Subscriptions">Subscriptions</option>
    <option value="Streaming">Streaming</option>
    <option value="Gaming">Gaming</option>
    <option value="Books">Books</option>
    <option value="Clothing">Clothing</option>
    <option value="Shoes">Shoes</option>
    <option value="Personal Care">Personal Care</option>
    <option value="Pharmacy">Pharmacy</option>
    <option value="Doctor">Doctor</option>
    <option value="Dentist">Dentist</option>
    <option value="Fitness">Fitness</option>
    <option value="Sports">Sports</option>
    <option value="Travel">Travel</option>
    <option value="Hotels">Hotels</option>
    <option value="Flights">Flights</option>
    <option value="Gifts">Gifts</option>
    <option value="Pets">Pets</option>
    <option value="Taxes">Taxes</option>
    <option value="Bank Fees">Bank Fees</option>
    <option value="Insurance">Insurance</option>
    <option value="Investments">Investments</option>
    <option value="Savings">Savings</option>
    <option value="Debt">Debt</option>
    <option value="Loans">Loans</option>
    <option value="Work">Work</option>
    <option value="Software">Software</option>
    <option value="Electronics">Electronics</option>
    <option value="Household">Household</option>
    <option value="Charity">Charity</option>
    <option value="Hobbies">Hobbies</option>
    <option value="Events">Events</option>
  </select>

  <button id="add-btn">Add Expense</button>
</div>

     <div class="period-filter">
  <div class="period-tabs">
    <button class="period-tab active" data-mode="day">Day</button>
    <button class="period-tab" data-mode="week">Week</button>
    <button class="period-tab" data-mode="month">Month</button>
    <button class="period-tab" data-mode="year">Year</button>
    <button class="period-tab" data-mode="total">Total</button>
  </div>

  <div class="period-nav">
    <button class="nav-btn" id="prev-period">←</button>
    <span id="period-label"></span>
    <button class="nav-btn" id="next-period">→</button>
  </div>
</div>

    <section class="history">
      <h3>Recent Transactions</h3>

      <div class="view-switcher">
    <button id="btn-show-list" class="view-tab active">Transactions</button>
    <button id="btn-show-summary" class="view-tab">Summary</button>
    <button id="btn-show-chart" class="view-tab">Chart</button>
</div>

<div id="container-list" class="view-content">
      <ul id="expense-list"></ul>
      </div>
      <div id="container-summary" class="view-content is-hidden">
    <div id="summary-list"></div>
</div>
<div id="container-chart" class="view-content is-hidden">
      <div class="chart-container" >
    <canvas id="expense-chart"></canvas>
</div>
</div>
    </section>
    
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
