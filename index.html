<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Expense</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <div id="app">
    <header>
      <button id="btn-export">Xprt</button>
      <p class="label">Total Balance</p>
      <h1 id="total-display">€ 0.00</h1>
    </header>

    <div class="input-card">
      <input type="number" id="amount-input" placeholder="0" step="1">
      <select id="category-input">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Bills">Bills</option>
        <option value="Test">Test</option>
      </select>
      <button id="add-btn">Add Expense</button>
    </div>

     <div class="period-filter">
  <div class="period-tabs">
    <button class="period-tab active" data-mode="day">Day</button>
    <button class="period-tab" data-mode="week">Week</button>
    <button class="period-tab" data-mode="month">Month</button>
    <button class="period-tab" data-mode="year">Year</button>
    <button class="period-tab" data-mode="total">Total</button>
  </div>

  <div class="period-nav">
    <button class="nav-btn" id="prev-period">←</button>
    <span id="period-label"></span>
    <button class="nav-btn" id="next-period">→</button>
  </div>
</div>

    <section class="history">
      <h3>Recent Transactions</h3>
      <ul id="expense-list"></ul>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
